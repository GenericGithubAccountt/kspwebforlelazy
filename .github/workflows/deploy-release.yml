name: Deploy Release to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Extract Release Asset
        run: |
          mkdir -p build_output
          # Downloads 'nuh' or 'nuh.zip' directly from the release event
          curl -L "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/nuh" -o release.zip || \
          curl -L "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/nuh.zip" -o release.zip
          
          unzip -o release.zip -d build_output

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
