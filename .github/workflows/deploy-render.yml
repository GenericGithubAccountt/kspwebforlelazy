name: Prepare Release for Render

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          
          # Download all release assets from the latest release automatically
          gh release download --dir dist --pattern "*.zip" || gh release download --dir dist
          
          # Unzip any downloaded zip file into dist
          cd dist
          unzip -q -o "*.zip" || true
          rm -f *.zip

      - name: Deploy to Build Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: render-deploy
