name: Prepare Release for Render

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - - name: Extract Release Asset
          run: |
            mkdir -p dist
            
            
            curl -sL \
              -H "Accept: application/octet-stream" \
              "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/nuh.zip" \
              -o output.zip
  
            
            file output.zip
            
            unzip -q -o output.zip -d dist
            rm -f output.zip

      - name: Deploy to Build Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: render-deploy
