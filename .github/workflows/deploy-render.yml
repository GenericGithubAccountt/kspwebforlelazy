name: Prepare Release for Render

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Split Large Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download --dir dist --pattern "*.zip" || gh release download --dir dist
          cd dist
          unzip -q -o "*.zip" || true
          rm -f *.zip

          # Find any file over 80MB and split it into 80MB parts (.part_aa, .part_ab, etc.)
          find . -type f -size +80M -exec split -b 80M {} {}.part_ \; -exec rm {} \;

      - name: Deploy to Build Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: render-deploy
