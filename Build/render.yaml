services:
  - type: web
    name: my-unity-webgl-game
    env: static
    staticPublishPath: ./Build
    headers:
      - path: /*.data
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.wasm
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.framework.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.unityweb
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.br
        name: Content-Encoding
        value: br
      - path: /*.gz
        name: Content-Encoding
        value: gzip
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
